[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "durin"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "bd_warehouse",
  "build123d==0.10.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
vscode = [
    "ocp-vscode",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D", # Docstring style
    "F403", # Star import used
    "F405", # Variable defined from star import
    "S101", # Use of assert statement
    "TC", # Type checking
]
